{% if messages %}
<div class="avisos">
  {% for message in messages %}
    <div class="aviso aviso--{% if message.level_tag == 'debug' %}info{% else %}{{ message.level_tag|default:'info' }}{% endif %}"{% if message.level_tag == 'error' or message.level_tag == 'warning' %} role="alert"{% else %} role="status"{% endif %}>{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
