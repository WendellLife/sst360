{% load static %}<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Erro no sistema</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem("rz-tema"); } catch (e) {}
  if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<link rel="stylesheet" href="{% static 'razach/css/fonts.css' %}">
<link rel="stylesheet" href="{% static 'razach/ds/tokens.css' %}">
<link rel="stylesheet" href="{% static 'razach/ds/base.css' %}">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--surface-page); color: var(--text-body); }
  .erro { max-width: 440px; text-align: left; }
  .erro img { height: 36px; width: auto; display: block; margin-bottom: 32px; }
  .erro h1 { font-size: 28px; margin: 0 0 12px; }
  .erro p { color: var(--text-muted); margin: 0 0 24px; }
  .erro a { color: var(--text-brand); font-weight: 600; }
  [data-theme="dark"] .so-claro, [data-theme="light"] .so-escuro { display: none; }
</style>
</head>
<body>
<main class="erro">
  <img class="so-claro" src="{% static 'razach/img/razach-combinado-gradiente.png' %}" alt="Razach Technology" width="132" height="36">
  <img class="so-escuro" src="{% static 'razach/img/razach-combinado-claro.png' %}" alt="Razach Technology" width="132" height="36">
  <h1>Algo deu errado do nosso lado</h1>
  <p>O erro foi registrado. Tente de novo em alguns minutos.</p>
  <a href="/">Voltar ao início</a>
</main>
</body>
</html>
