{% comment %}Radio. Parâmetros: nome, valor, rotulo, descricao, marcada, desabilitada, id, attrs.{% endcomment %}<label class="rz-c-choice{% if desabilitada %} is-disabled{% endif %}"><input type="radio" class="rz-c-radio" name="{{ nome }}" value="{{ valor }}"{% if id %} id="{{ id }}"{% endif %}{% if marcada %} checked{% endif %}{% if desabilitada %} disabled{% endif %}{% if attrs %} {{ attrs|safe }}{% endif %}><span><span class="rz-c-radio-dot"></span></span>{% if rotulo or descricao %}<span class="rz-c-choice-text">{% if rotulo %}<span class="rz-c-choice-label">{{ rotulo }}</span>{% endif %}{% if descricao %}<span class="rz-c-choice-desc">{{ descricao }}</span>{% endif %}</span>{% endif %}</label>
