{% comment %}Checkbox. Parâmetros: nome, valor (0 aparece), rotulo, descricao, marcada, parcial, desabilitada, rotulo_aria, id, classe (do label), attrs (do input).{% endcomment %}<label class="rz-c-choice{% if desabilitada %} is-disabled{% endif %}{% if classe %} {{ classe }}{% endif %}"><input type="checkbox" class="rz-c-checkbox"{% if id %} id="{{ id }}"{% endif %}{% if nome %} name="{{ nome }}"{% endif %}{% if valor is not None and valor != "" %} value="{{ valor }}"{% endif %}{% if marcada %} checked{% endif %}{% if desabilitada %} disabled{% endif %}{% if parcial %} data-parcial{% endif %}{% if rotulo_aria %} aria-label="{{ rotulo_aria }}"{% endif %}{% if attrs %} {{ attrs|safe }}{% endif %}><span>{% icone "check" 12 "rz-c-mark-check" %}{% icone "minus" 12 "rz-c-mark-minus" %}</span>{% if rotulo or descricao %}<span class="rz-c-choice-text">{% if rotulo %}<span class="rz-c-choice-label">{{ rotulo }}</span>{% endif %}{% if descricao %}<span class="rz-c-choice-desc">{{ descricao }}</span>{% endif %}</span>{% endif %}</label>
