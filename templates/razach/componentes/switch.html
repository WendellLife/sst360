{% comment %}Switch. Parâmetros: nome, valor (0 aparece; padrão "on"), rotulo (nomeia o estado ligado), descricao, marcado, desabilitado, tamanho (sm|md), id, attrs.{% endcomment %}<label class="rz-c-switch-wrap{% if desabilitado %} is-disabled{% endif %}"><input type="checkbox" role="switch" class="rz-c-switch{% if tamanho == 'sm' %} is-sm{% endif %}"{% if id %} id="{{ id }}"{% endif %}{% if nome %} name="{{ nome }}"{% endif %}{% if valor is not None and valor != "" %} value="{{ valor }}"{% endif %}{% if marcado %} checked{% endif %}{% if desabilitado %} disabled{% endif %}{% if attrs %} {{ attrs|atributos }}{% endif %}><span><span></span></span>{% if rotulo or descricao %}<span class="rz-c-switch-text">{% if rotulo %}<span class="rz-c-switch-label">{{ rotulo }}</span>{% endif %}{% if descricao %}<span class="rz-c-switch-desc">{{ descricao }}</span>{% endif %}</span>{% endif %}</label>
