name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sst360
          POSTGRES_PASSWORD: sst360
          POSTGRES_DB: sst360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sst360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONUTF8: "1"
      DATABASE_URL: postgres://sst360:sst360@127.0.0.1:5432/sst360
      # check e makemigrations rodam como em desenvolvimento; o check --deploy abaixo roda com DEBUG=False.
      DJANGO_DEBUG: "True"
      # Piso de cobertura: cobertura medida em 2026-10 (93,5%) arredondada para baixo. Só sobe.
      COBERTURA_MINIMA: "93"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage pip-audit

      - name: manage.py check
        run: python manage.py check

      - name: Migrations em dia (makemigrations --check)
        run: python manage.py makemigrations --check --dry-run

      - name: Testes com cobertura
        run: |
          coverage run manage.py test --noinput
          coverage report --fail-under="$COBERTURA_MINIMA"

      - name: check --deploy (DEBUG=False, chave gerada no job)
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: sst360.exemplo.com.br
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          python manage.py check --deploy

      # Hoje acusa vulnerabilidades em django 5.2.6, python-dotenv 1.1.1 e requests 2.32.3
      # (ver relatório da Sonda). Deixa de ser informativo assim que o requirements.txt for atualizado:
      # remova o continue-on-error nesse momento.
      - name: Auditoria de dependências (pip-audit)
        continue-on-error: true
        run: pip-audit -r requirements.txt
